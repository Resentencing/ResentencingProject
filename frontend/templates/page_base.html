<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resentence and Decarcerate (RAD){% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/rad-scales-theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/rad-graphics.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body class="rad-app">
  <div class="wp-site-blocks">
    {% include "includes/rad_site_header.html" %}

    <main class="wp-block-group is-layout-flow">
      {% block content %}{% endblock %}
    </main>

    {% include "includes/rad_site_footer.html" %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
