<!DOCTYPE html>
<html>
<head>
    <title>File Viewer</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 8px 12px; border: 1px solid #ddd; }
        th { background-color: #f0f0f0; }
    </style>
</head>
<body>
    <h2>Archived Files</h2>
    <table>
        <thead>
            <tr>
                <th>Filename</th>
                <th>Download</th>
            </tr>
        </thead>
        <tbody>
            {% for file in files %}
            <tr>
                <td>{{ file.filename }}</td>
                <td><a href=\"{{ file.path }}\" target=\"_blank\">Download</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
